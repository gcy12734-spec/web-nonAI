<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>车辆详情 - Online Car Sale</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-layout { display: flex; gap: 40px; margin-top: 30px; }
        .detail-img { flex: 1.5; background: #eee; height: 400px; display: flex; align-items: center; justify-content: center; }
        .detail-info { flex: 1; }
        .price-tag { font-size: 2rem; color: #000; font-weight: bold; margin: 20px 0; }
        .spec-list { list-style: none; border-top: 1px solid #eee; padding-top: 20px; }
        .spec-list li { margin-bottom: 10px; color: #666; }
        .buy-box { margin-top: 30px; padding: 20px; border: 1px solid #000; text-align: center; }
    </style>
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Logo">
        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="search.html">返回搜索</a></li>
            </ul>
        </nav>
    </header>

    <main class="container detail-layout">
        <div class="detail-img">
            <span>车辆高清大图展示区</span>
        </div>

        <div class="detail-info">
            <h1>Tesla Model 3 - 2022款</h1>
            <p class="price-tag">¥ 185,000</p>
            
            <ul class="spec-list">
                <li><strong>上牌时间：</strong> 2022年05月</li>
                <li><strong>表显里程：</strong> 1.5万公里</li>
                <li><strong>所在地：</strong> 北京</li>
                <li><strong>排放标准：</strong> 纯电动</li>
            </ul>

            <div class="buy-box">
                <h3>意向购买</h3>
                <p style="font-size: 0.8rem; margin-bottom: 15px;">点击按钮预约看车或直接下单</p>
                <button class="btn-block" onclick="handleBuy()">立即购买</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
