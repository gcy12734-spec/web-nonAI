<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卖家登录 - Online Car Sale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Logo">
        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="log-in.html" class="active">登录</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-wrapper">
            <h2>卖家登录</h2>
            <form id="loginForm">
                <label>用户名</label>
                <input type="text" id="loginUser" placeholder="请输入用户名" required>
                
                <label>密码</label>
                <input type="password" id="loginPass" placeholder="请输入密码" required>
                
                <div class="form-footer">
                    <a href="#" onclick="alert('请联系管理员找回密码')">忘记密码？</a>
                </div>

                <button type="submit" class="btn-block">立即登录</button>
            </form>
            <p class="form-helper">还没有账号？<a href="register.html">创建一个</a></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
